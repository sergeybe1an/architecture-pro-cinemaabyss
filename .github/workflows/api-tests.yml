name: API Tests

on:
  push:
    branches: [ main, master, cinema ]
    paths:
      - 'src/**'
      - 'tests/postman/**'
      - 'docker-compose.yml'
      - '.github/workflows/api-tests.yml'
  pull_request:
    branches: [ main, master, cinema ]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to run tests against
        required: true
        default: docker
        type: choice
        options:
          - local
          - docker

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Docker Compose version
        run: docker compose version

      - name: Start services
        run: |
          docker compose build
          docker compose up -d

      - name: Show containers
        run: docker compose ps

      - name: Show Docker networks
        run: |
          docker network ls
          docker network inspect cinemaabyss-network || true

      - name: Wait for proxy
        run: |
          timeout 180 bash -c '
            until curl -fs http://localhost:8000/health; do
              echo "Waiting..."
              sleep 5
            done
          '

      - name: Verify monolith from Docker network
        run: |
          docker run --rm \
            --network cinemaabyss-network \
            alpine sh -c '
              apk add --no-cache curl bind-tools
              echo "=== DNS ==="
              nslookup monolith || true
              echo
              echo "=== CURL ==="
              curl -v http://monolith:8080/health || true
            '

      - name: Inspect containers
        run: |
          docker compose ps -a

          docker inspect cinemaabyss-monolith --format='Status={{.State.Status}} ExitCode={{.State.ExitCode}}'
          docker inspect cinemaabyss-movies-service --format='Status={{.State.Status}} ExitCode={{.State.ExitCode}}'
          docker inspect cinemaabyss-events-service --format='Status={{.State.Status}} ExitCode={{.State.ExitCode}}'
      - name: Show monolith logs
        if: always()
        run: |
          echo "===== MONOLITH ====="
          docker logs cinemaabyss-monolith || true

          echo "===== MOVIES ====="
          docker logs cinemaabyss-movies-service || true
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: tests/postman/package-lock.json

      - name: Install dependencies
        working-directory: tests/postman
        run: npm install

      - name: Build API tests image
        working-directory: tests/postman
        run: docker build -t cinemaabyss-api-tests .

      - name: Run API tests
        working-directory: tests/postman
        run: |
          docker run --rm \
            --network cinemaabyss-network \
            -v "$(pwd)/reports:/app/reports" \
            cinemaabyss-api-tests

      - name: Show service logs
        if: always()
        run: |
          docker compose ps -a

          echo "===== MONOLITH ====="
          docker logs cinemaabyss-monolith || true

          echo "===== MOVIES ====="
          docker logs cinemaabyss-movies-service || true

          echo "===== EVENTS ====="
          docker logs cinemaabyss-events-service || true

      - name: Stop services
        if: always()
        run: docker compose down -v